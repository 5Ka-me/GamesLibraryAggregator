services:
  # Backend (.NET) — a stateless Steam proxy: OpenID sign-in + one server-side
  # Steam API key. No database; the only state is the cookie-signing keys
  # (persisted to a volume so sessions survive restarts).
  api:
    build:
      context: .
      dockerfile: SteamEGSAggregator/Dockerfile
    container_name: steamegs-api
    restart: unless-stopped
    environment:
      # Production by default: Development would expose Swagger and the
      # developer exception page (which renders request headers) on 0.0.0.0.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_HTTP_PORTS: "8080"
      # REQUIRED: your Steam Web API key (steamcommunity.com/dev/apikey).
      Steam__ApiKey: ${STEAM_API_KEY}
      # Where the browser reaches the web app (CORS + post-login redirect).
      Web__Origin: ${WEB_ORIGIN:-http://localhost:3000}
      # Where the browser reaches THIS api (OpenID return URL).
      PublicUrl: ${API_PUBLIC_URL:-http://localhost:8080}
      DataProtection__KeysPath: /keys
    ports:
      - "8080:8080"
    volumes:
      - steamegs-dpkeys:/keys
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Frontend (React, built and served via nginx).
  # Context is the REPO ROOT: the web app consumes the @app/shared workspace
  # package from packages/, which lives outside steam-egs-aggregator/.
  frontend:
    build:
      context: ..
      dockerfile: steam-egs-aggregator/Dockerfile
      args:
        # The user's browser calls the backend at this address (the port published by the api service).
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080}
    container_name: steamegs-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  steamegs-dpkeys:
