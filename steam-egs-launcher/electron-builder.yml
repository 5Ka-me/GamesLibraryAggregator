appId: com.5ka.steamegslauncher
productName: GL Aggregator
directories:
  buildResources: resources
  output: dist
files:
  - out/**
extraResources:
  # Bundled legendary.exe (fetch with `npm run fetch:legendary` before packaging).
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
      - '!README.md'
win:
  target: nsis
  icon: resources/icon.ico
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: GL-Aggregator-Setup-${version}.${ext}
# Auto-update channel: GitHub Releases of the public repo. `npm run release`
# builds and uploads a release draft (needs GH_TOKEN with repo scope);
# publishing the draft makes every installed launcher pick the update up.
publish:
  provider: github
  owner: 5Ka-me
  repo: GamesLibraryAggregator
