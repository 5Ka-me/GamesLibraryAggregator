appId: com.5ka.steamegslauncher
productName: GL Aggregator
directories:
  buildResources: resources
  output: dist
# The launcher has no runtime npm dependencies (electron-vite bundles everything
# into out/), so skip electron-builder's "install production dependencies" step.
# In an npm workspace that step runs `npm install --production` inside this
# package and prunes the root node_modules — removing app-builder-bin, which
# electron-builder needs a moment later (CI failed with ENOENT on it).
npmRebuild: false
files:
  - out/**
extraResources:
  # Bundled legendary.exe (fetch with `npm run fetch:legendary` before packaging).
  - from: resources/bin
    to: bin
    filter:
      - '**/*'
      - '!README.md'
win:
  target: nsis
  icon: resources/icon.ico
# One-click, per-user installer (AppData\Local\Programs, no UAC, no wizard):
# the first install is a double-click, and updates install silently in the
# background — the user only ever sees "restart to update".
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  # Recreate the shortcuts on every install/update, so an update never leaves
  # a desktop shortcut pointing at a stale path (blank icon).
  createDesktopShortcut: always
  createStartMenuShortcut: false
  artifactName: GL-Aggregator-Setup-${version}.${ext}
# Auto-update channel: GitHub Releases of the public repo. Releases are cut by
# `npm run release <version>` at the repo root → the tag push runs
# .github/workflows/release.yml, which builds here and publishes the release
# right away (not a draft) so installed launchers pick the update up.
publish:
  provider: github
  owner: 5Ka-me
  repo: GamesLibraryAggregator
  releaseType: release
